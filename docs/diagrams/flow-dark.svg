<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="772" viewBox="0 0 1200 772" role="img" aria-labelledby="t d">
<title id="t">One task through CostRouter.route in ai-cost-aware-router</title>
<desc id="d">Eight steps run top to bottom. A task enters CostRouter, which picks a start tier, narrows the tiers at 80 percent of the day, estimates the cost, has ModelTiers call the ChatModel, and runs the check for the task kind. Two warning rows show a check that lets a wrong answer through and the tasks sent to a person. The run ends with the router at 71.3 percent accuracy against 59.3 percent for the large model.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="771" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="770" rx="16"/>
<text class="title" x="48" y="68">One task through the cascade</text>
<text class="caption" x="48" y="100">Cheapest tier first, a check after each answer. Amber: a check fooled, and tasks sent to a person.</text>

<rect class="actor" x="410" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">Task</text>
<rect class="svc" x="535" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="600" y="158" text-anchor="middle">CostRouter</text>
<rect class="svc" x="695" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="760" y="158" text-anchor="middle">ModelTiers</text>
<rect class="svc" x="855" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="930" y="158" text-anchor="middle">AnswerChecks</text>
<rect class="svc" x="1028" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1088" y="158" text-anchor="middle">ChatModel</text>
<path class="hair" d="M460 176V688M600 176V688M760 176V432M930 176V560M1088 176V432"/>
<path class="hair" d="M66 216V664"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Pick the start tier</text>
<text class="sub" x="96" y="232">start_index(kind, hard_signal)</text>
<path class="sync" d="M460 216H600"/>
<text class="label t-accent" x="472" y="206">route(task)</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Narrow the tiers</text>
<text class="sub" x="96" y="296">at 80% of the day: no large</text>
<rect class="slot" x="594" y="262" width="12" height="36" rx="5"/>
<text class="label t-accent" x="616" y="285">tighten_at 0.8</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">Estimate, then compare</text>
<text class="sub" x="96" y="360">cap $0.0008 or money left</text>
<path class="sync" d="M600 344H760"/>
<text class="label t-accent" x="612" y="334">estimate()</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">The tier answers</text>
<text class="sub" x="96" y="424">billed tokens x price = cost</text>
<path class="sync" d="M760 408H1088"/>
<text class="label t-accent" x="772" y="398">complete()</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">Run the check for the kind</text>
<text class="sub" x="96" y="488">refund: recomputed by code</text>
<path class="sync" d="M600 472H930"/>
<text class="label t-accent" x="612" y="462">check()</text>
<circle class="dot-w" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="532">A wrong answer passes</text>
<text class="sub" x="96" y="552">policy_quote: 5 at large</text>
<path class="fail" d="M930 536H600"/>
<text class="label t-warn" x="612" y="526">passed (wrong)</text>
<circle class="dot-w" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6a</text>
<text class="label b t-warn" x="96" y="596">Checks fail, tiers used up</text>
<text class="sub" x="96" y="616">38 of 150 go to a person</text>
<path class="fail" d="M600 600H460"/>
<text class="label t-warn" x="472" y="590">to a person</text>
<circle class="dot-g" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6b</text>
<text class="label b t-ink" x="96" y="660">Answer and decision</text>
<text class="sub" x="96" y="680">tiers tried, checks, costs</text>
<path class="ok" d="M600 664H460"/>
<text class="label t-good" x="472" y="654">answer</text>
<rect class="win" x="700" y="644" width="420" height="40" rx="10"/>
<text class="label b t-good" x="716" y="669">accuracy 71.3% against 59.3% for large</text>

<path class="sync" d="M48 728H112"/><text class="legend" x="124" y="733">sync call</text>
<path class="fail" d="M696 728H760"/><text class="legend" x="772" y="733">failure path</text>
<path class="ok" d="M928 728H992"/><text class="legend" x="1004" y="733">result</text>
</svg>
