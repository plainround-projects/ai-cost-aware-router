<text class="sub" x="304" y="232">cli.py, wiring.py</text>
<rect class="boundary" x="288" y="272" width="600" height="316" rx="14"/>
<text class="tag" x="304" y="300">application</text>
<rect class="svc" x="304" y="324" width="216" height="92" rx="12"/>
<text class="name" x="320" y="356">experiments</text>
<text class="sub" x="320" y="380">experiments.py</text>
<text class="sub" x="320" y="402">measure, tune, route</text>
<rect class="svc" x="640" y="324" width="216" height="116" rx="12"/>
<text class="name" x="656" y="356">CostRouter</text>
<text class="sub" x="656" y="380">router.py</text>
<text class="sub" x="656" y="402">cap $0.0008/request</text>
<text class="sub" x="656" y="424">tighten_at 0.8</text>
<rect class="svc" x="304" y="480" width="216" height="94" rx="12"/>
<text class="name" x="320" y="512">AnswerChecks</text>
<text class="sub" x="320" y="536">answer_checks.py</text>
<text class="sub" x="320" y="558">a check per kind</text>
<rect class="svc" x="640" y="480" width="216" height="94" rx="12"/>
<text class="name" x="656" y="512">ModelTiers</text>
<text class="sub" x="656" y="536">tiers.py</text>
<text class="sub" x="656" y="558">call(), estimate()</text>
<rect class="svc" x="976" y="480" width="160" height="116" rx="12"/>
<text class="name" x="992" y="512">ChatModel</text>
<text class="sub" x="992" y="536">recorded</text>
<text class="sub" x="992" y="558">openai_compat</text>
<text class="sub" x="992" y="580">anthropic</text>
<rect class="boundary" x="288" y="612" width="600" height="84" rx="14"/>
<text class="tag" x="304" y="640">domain: standard library only</text>
<rect class="slot" x="304" y="652" width="69" height="32" rx="6"/>
